<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LearnLoop learning</title>
<link rel="stylesheet" href="ui.css">
<style>
  html,body{height:100%}
  .learn{position:fixed}
  .over{position:fixed}
  .lbody{padding-block:36px}
  .prompt{font-size:clamp(30px,5vw,46px)}
  .choice{min-width:120px;min-height:100px;font-size:36px}
  .choice.pic{font-size:60px;min-width:130px}
  .choice.text{font-size:20px;min-height:64px;min-width:140px;max-width:100%;font-family:var(--f-body);font-weight:700}
  .groups{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
  .groups>div{border:2px dashed var(--line);border-radius:16px;padding:10px 14px;display:grid;justify-items:center;gap:6px;min-width:140px}
  .groups b{font-size:22px;color:var(--brand-text)} .groups span{font-size:34px;max-width:260px}
  .tenframe{display:grid;grid-template-columns:repeat(5,40px);gap:6px;padding:8px;border:3px solid var(--ink);border-radius:10px}
  .tenframe i{width:40px;height:40px;border-radius:50%;border:2px dashed var(--line);display:block} .tenframe i.on{background:var(--brand);border:0}
  .tensones{display:flex;align-items:flex-end;gap:5px;flex-wrap:wrap;justify-content:center} .tensones .ten{width:14px;height:110px;display:block;background:repeating-linear-gradient(to bottom,var(--brand) 0 10px,var(--surface) 10px 11px);border:1px solid var(--brand-text);border-radius:3px}
  .tensones .one{width:14px;height:14px;display:block;background:var(--lime2);border:1px solid var(--leaf);border-radius:3px} .tensones .gap{width:14px}
  .array{display:grid;gap:6px} .array i{width:26px;height:26px;border-radius:50%;background:var(--brand);display:block}
  .fbar{display:grid;width:min(420px,90vw);height:44px;border:3px solid var(--ink);border-radius:8px;overflow:hidden} .fbar i{border-right:2px solid var(--ink);display:block} .fbar i:last-child{border-right:0} .fbar i.on{background:var(--lime2)}
  .coins{display:flex;gap:12px;flex-wrap:wrap;justify-content:center} .coin{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;color:#00212B;border:3px solid rgb(0 0 0/.2)}
  .coin.copper{background:#D9915B} .coin.silver{background:#D7DDE2} .coin.gold{background:#E8C55A}
  svg.clock{width:200px;height:200px} .cface{fill:var(--surface);stroke:var(--ink);stroke-width:4} .cnum{font:700 11px var(--f-body);fill:var(--ink)} .chour{stroke:var(--ink)} .cmin{stroke:var(--brand)} .cdot{fill:var(--ink)}
  .bigtext{font-family:var(--f-display);font-weight:800;font-size:72px;line-height:1;color:var(--brand-text)} .bigtext.word{letter-spacing:.08em;color:var(--ink);background:var(--surface);border:3px solid var(--brand);border-radius:18px;padding:10px 28px}
  .sentence{font-size:24px;font-weight:700;background:var(--surface);border-left:6px solid var(--brand);border-radius:8px;padding:10px 18px;max-width:640px}
  .passage{font-size:19px;line-height:1.7;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;max-width:640px}
  .column{font:800 34px/1.25 ui-monospace,Consolas,monospace;margin:0;text-align:right}
  /* drawings for Years 4 to 6 and Reasoning */
  .svgbox{display:block} .qsvg{max-width:100%;height:auto}
  .qsvg .s-soft{fill:var(--sky-soft)} .qsvg .s-line{stroke:var(--ink);stroke-width:2;stroke-linejoin:round} .qsvg .s-fill{fill:var(--brand)} .qsvg .s-brandline{stroke:var(--brand)}
  .qsvg .s-text{fill:var(--ink);font:700 13px var(--f-body)} .qsvg .s-small{fill:var(--muted);font:600 11px var(--f-body)} .qsvg .s-gridline{stroke:var(--line);stroke-width:1}
  /* shape puzzles keep fixed paper colours in light and dark mode, so white, light and dark always mean the same */
  svg.nvr{background:#FFFFFF;border-radius:10px}
  svg.nvr .s-empty{fill:#FFFFFF} svg.nvr .s-soft{fill:#A9CBF7} svg.nvr .s-fill{fill:#00212B} svg.nvr .s-line{stroke:#00212B;stroke-width:2.5}
  svg.nvr .s-dot{fill:#C4553C} svg.nvr .s-cell{fill:#FFFFFF;stroke:#B9CCE6;stroke-width:2} svg.nvr .s-ask{stroke:#1D6BD0;stroke-dasharray:6 4}
  svg.nvr .s-big{fill:#1D6BD0;font:800 30px var(--f-display)} svg.nvr .s-text{fill:#00212B} svg.nvr .s-mirror{stroke:#C4553C;stroke-width:3;stroke-dasharray:7 5}
  .choice.svgc{display:grid;justify-items:center;gap:4px;padding:8px 10px;min-width:110px;min-height:auto;font-size:18px}
  .choice.svgc .opt{font:800 18px var(--f-display)} .choice.svgc svg{width:84px;height:auto}
  .switch{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:16px;max-width:520px}
  .switch input{width:22px;height:22px;margin-top:2px;accent-color:var(--brand)}
  .speakbtn{border:0;background:var(--sky-soft);border-radius:99px;width:52px;height:52px;font-size:24px}
</style>
</head>
<body>
<div id="app"><div class="over"><div class="card"><h2>Getting your learning ready…</h2></div></div></div>
<script src="curriculum.js"></script>
<script src="curriculum-ks2.js"></script>
<script src="reasoning.js"></script>
<script src="engine.js"></script>
<script src="learn.js"></script>
</body>
</html>
