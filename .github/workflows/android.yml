name: android app
on:
  push:
    branches: [main, "mobile-*"]
    paths: ['mobile/**', 'extension/**', '.github/workflows/android.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Build the test app
        working-directory: mobile/android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log
      - name: Show build errors
        if: failure()
        working-directory: mobile/android
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
      - name: Publish the test app
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk LearnLoop-android-preview.apk
          gh release view android-preview >/dev/null 2>&1 || gh release create android-preview --prerelease --title "LearnLoop for Android (test version)" --notes-file mobile/RELEASE-NOTES.md
          gh release edit android-preview --notes-file mobile/RELEASE-NOTES.md
          gh release upload android-preview LearnLoop-android-preview.apk --clobber
